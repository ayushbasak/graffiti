version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Exposed ports removed to keep backend private on the host
    # It remains available internally as http://backend:5000
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - PORT=5000
      - NODE_ENV=production
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - PAYU_KEY=${PAYU_KEY}
      - PAYU_SALT=${PAYU_SALT}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 200M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Port 80: Cloudflare's SSL connects to this
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  consumer:
    build:
      context: ./backend/consumer
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI}
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M